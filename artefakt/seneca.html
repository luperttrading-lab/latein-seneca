<title>Seneca übersetzen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #f6f2ea; --karte: #fffdf8; --text: #1f1c17; --leise: #6b645a; --linie: #e2dacb;
  --akzent: #8c2f1f; --akzent-text: #fff;
  /* Satzglieder wie im Schulbuch: Prädikat blau, Subjekt rot; Palette Okabe-Ito (farbenblind-sicher) */
  --p: #0072B2; --pn: #2a8fc9; --s: #D55E00; --o: #009E73; --od: #b7790a; --a: #a5558a; --t: #6b645a; --k: #1f1c17; --v: #6b645a;
  --sel: #ffe58a; --ok: #cdeccf; --bad: #f8c9c3; --fokus: #1f5fbf;
  --lehrer: #f1ead9; --tipp: #fff4cc;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17161b; --karte: #212026; --text: #ece7de; --leise: #a39d92; --linie: #35333c;
    --akzent: #e07a5f; --akzent-text: #1a0d08;
    --p: #4ea8e6; --pn: #8fcdf2; --s: #ff8c42; --o: #2ec28f; --od: #f2b134; --a: #e49ac4; --t: #a39d92; --k: #ece7de; --v: #a39d92;
    --sel: #6b5a12; --ok: #1f4d27; --bad: #5c231d; --fokus: #7cb2ff;
    --lehrer: #2b2821; --tipp: #3a3216;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
  font-size: 16px; line-height: 1.5; touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* Kopf */
.kopf {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid var(--linie);
}
.werk { font-family: var(--serif); font-size: 18px; }
.autor { font-weight: 700; }
.schrift { font-style: italic; color: var(--leise); }
.version {
  background: none; border: 0; padding: 6px 2px; color: var(--leise); font-size: 13px;
  text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer;
}

main {
  max-width: 680px; margin: 0 auto;
  padding-block: 12px calc(env(safe-area-inset-bottom) + 96px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.lade { color: var(--leise); text-align: center; padding: 48px 0; }

/* Reiter unten */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex;
  background: var(--karte); border-top: 1px solid var(--linie);
  padding: 6px 8px calc(env(safe-area-inset-bottom) + 6px);
}
.tabs button {
  flex: 1; background: none; border: 0; padding: 10px 2px; border-radius: 10px;
  color: var(--leise); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap;
}
.tabs button.an { color: var(--akzent); background: var(--bg); }

/* Satznavigation */
.navi { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; }
.navi .pfeil {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--linie);
  background: var(--karte); font-size: 22px; cursor: pointer; flex: none;
}
.navi .pfeil:disabled { opacity: .35; cursor: default; }
.navi .mitte {
  flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--linie); background: var(--karte);
  cursor: pointer; font-size: 15px;
}
.navi .mitte small { color: var(--leise); }
.navi .mitte::after { content: " ▾"; color: var(--leise); }

.modus { display: flex; background: var(--linie); border-radius: 10px; padding: 3px; margin-bottom: 12px; }
.modus button {
  flex: 1; border: 0; background: none; padding: 7px; border-radius: 8px; font-size: 14px;
  font-weight: 600; color: var(--leise); cursor: pointer;
}
.modus button.an { background: var(--karte); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.thema { color: var(--leise); font-size: 14px; margin: 0 0 8px; }
.thema b { color: var(--text); font-weight: 600; }
.kontext { font-family: var(--serif); color: var(--leise); font-size: 16px; font-style: italic; margin-bottom: 4px; }

/* Lateinischer Text */
.latein {
  font-family: var(--serif); font-size: 22px; line-height: 2; background: var(--karte);
  border: 1px solid var(--linie); border-radius: 16px; padding: 10px 12px;
}
.wg { white-space: nowrap; }
.wort {
  cursor: pointer; border-radius: 6px; padding: 1px 2px; margin: 0 -1px;
  transition: background-color .15s ease;
}
.wort:active { background: var(--linie); }
.pz { color: var(--leise); }
/* Jede Rolle hat Farbe UND Muster, damit sie auch ohne Farbe lesbar bleibt */
.r-P { color: var(--p); font-weight: 700; }
.r-P.hs { text-decoration: underline 2px; text-underline-offset: 5px; }        /* Prädikat des Hauptsatzes */
.r-P.pn { color: var(--pn); font-style: italic; }                                /* Prädikatsnomen */
.r-S { color: var(--s); font-weight: 600; text-decoration: underline double 1.5px; text-underline-offset: 4px; }
.r-O { color: var(--o); text-decoration: underline 1.5px; text-underline-offset: 4px; }
.r-O.od { color: var(--od); text-decoration-style: dotted; }                     /* Dativobjekt */
.r-A { color: var(--a); text-decoration: underline dashed 1.5px; text-underline-offset: 4px; }
.r-T { color: var(--t); font-style: italic; }
.r-K { color: var(--k); font-weight: 700; }
.r-V { color: var(--v); font-style: italic; text-decoration: underline wavy 1px; text-underline-offset: 4px; }
.wort.e { text-decoration: underline 2px; text-underline-offset: 5px; }          /* Einleitewort eines Gliedsatzes */
.latein { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.wort.sel { background: var(--sel); }
.wort.ok { background: var(--ok); }
.wort.bad { background: var(--bad); }
.wort.fokus { outline: 2px solid var(--fokus); outline-offset: 1px; }

.legende { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 4px 0; font-size: 14px; font-family: var(--serif); }
.legende .wort { cursor: default; padding: 0; margin: 0; }

/* Satzbild */
.satzbild { margin-top: 12px; border: 1px solid var(--linie); border-radius: 16px; background: var(--karte); overflow: hidden; }
.satzbild summary {
  list-style: none; cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: 15px;
  display: flex; justify-content: space-between; align-items: center;
}
.satzbild summary::-webkit-details-marker { display: none; }
.satzbild summary::after { content: "▾"; color: var(--leise); }
.satzbild[open] summary::after { content: "▴"; }
.satzbild .zeilen { padding: 0 10px 10px; }
.zeile {
  margin-left: calc(var(--lvl) * 16px); padding: 6px 0 6px 10px; border-left: 3px solid var(--linie);
}
.zeile[data-lvl="0"] { border-left-color: var(--akzent); }
.ztag { font-size: 12px; font-weight: 700; color: var(--leise); text-transform: uppercase; letter-spacing: .02em; }
.zwoerter { font-family: var(--serif); font-size: 19px; line-height: 1.7; }
.zinfo { font-size: 13px; color: var(--leise); }
.gesperrt { padding: 10px 14px; color: var(--leise); font-size: 14px; }

/* Aufgabenkarte */
.karte {
  margin-top: 12px; background: var(--karte); border: 1px solid var(--linie); border-radius: 16px; padding: 14px;
}
.kkopf { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.phase {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
  padding: 3px 8px; border-radius: 999px; background: var(--linie);
}
.ph-gliedern { color: var(--k); } .ph-verb { color: var(--p); } .ph-subjekt { color: var(--s); }
.ph-ergaenzung { color: var(--o); } .ph-bezug { color: var(--t); } .ph-konstr { color: var(--a); }
.ph-falle { background: var(--bad); color: var(--text); } .ph-uebersetzen { color: var(--akzent); }
.ph-selbst { color: var(--text); }
.zaehler { font-size: 13px; color: var(--leise); }
.frage { margin: 4px 0 10px; font-size: 16px; }

.antippen { font-size: 13px; color: var(--leise); margin: -4px 0 10px; }

/* Erste Orientierung */
.intro { background: var(--lehrer); border: 1px solid var(--linie); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
.intro h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 20px; }
.intro ol { margin: 0 0 10px; padding-left: 20px; }
.intro li { margin-bottom: 6px; }
.intro .probe { font-family: var(--serif); font-size: 17px; }

.optionen { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.option {
  text-align: left; border: 1.5px solid var(--linie); background: var(--bg); border-radius: 12px;
  padding: 11px 12px; cursor: pointer; font-size: 15px;
}
.option.falsch { border-color: var(--p); opacity: .75; }
.option.richtig { border-color: var(--o); background: var(--ok); }
.option:disabled { cursor: default; }
.warum { display: block; font-size: 13px; color: var(--leise); margin-top: 4px; }

.tipp { background: var(--tipp); border-radius: 10px; padding: 10px 12px; font-size: 15px; margin-bottom: 10px; }
.rueck { border-left: 4px solid var(--p); padding: 6px 10px; margin-bottom: 10px; font-size: 15px; }
.rueck b { font-family: var(--serif); }
.lehrer { background: var(--lehrer); border-left: 4px solid var(--akzent); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 15px; }
.ltitel { font-weight: 700; margin-bottom: 2px; }

.knoepfe { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  border: 0; background: var(--akzent); color: var(--akzent-text); font-weight: 600; border-radius: 12px;
  padding: 10px 16px; cursor: pointer; font-size: 15px;
}
.btn2 {
  border: 1.5px solid var(--linie); background: none; border-radius: 12px; padding: 9px 14px; cursor: pointer; font-size: 15px;
}
.voll { width: 100%; }
.rechts { margin-left: auto; }

.punkte { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.punkt {
  width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--linie); font-size: 12px;
  color: var(--leise); cursor: pointer; padding: 0;
}
.punkt.ok { background: var(--o); color: #fff; }
.punkt.fehler { background: var(--a); color: #fff; }
.punkt.hilfe { background: var(--leise); color: var(--bg); }
.punkt.akt { outline: 2px solid var(--text); outline-offset: 1px; }
.punkt:disabled { opacity: .45; cursor: default; }

textarea {
  width: 100%; min-height: 120px; resize: vertical; border: 1.5px solid var(--linie); border-radius: 12px;
  padding: 10px 12px; font: 16px/1.5 var(--sans); background: var(--bg); color: var(--text); margin-bottom: 10px;
}
textarea:focus { outline: none; border-color: var(--akzent); }
.loesung { border: 1px solid var(--linie); border-radius: 12px; padding: 10px 12px; margin: 10px 0; font-size: 15px; }
.kontrolle { margin: 10px 0; font-size: 15px; }
.kontrolle summary { cursor: pointer; font-weight: 600; }
.kontrolle ul { margin: 6px 0 0; padding-left: 20px; }
.merke { background: var(--lehrer); border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
.merke ul { margin: 4px 0 0; padding-left: 20px; }
.bilanz { font-size: 14px; color: var(--leise); margin: 8px 0; }

/* Checkliste (selbstständig) */
.haken { list-style: none; padding: 0; margin: 0 0 12px; }
.haken li { border-bottom: 1px solid var(--linie); }
.haken label { display: flex; gap: 10px; padding: 9px 0; cursor: pointer; }
.haken input { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--akzent); }
.haken small { display: block; color: var(--leise); }

/* Blatt (Wortkarte, Übersicht) */
.schleier { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; opacity: 0; transition: opacity .25s; }
.schleier.an { opacity: 1; }
.blatt {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 82vh; overflow: auto;
  background: var(--karte); border-radius: 20px 20px 0 0; padding: 8px 18px calc(env(safe-area-inset-bottom) + 18px);
  transform: translateY(100%); transition: transform .28s ease; max-width: 680px; margin: 0 auto;
  box-shadow: 0 -8px 30px rgba(0,0,0,.25);
}
.blatt.an { transform: translateY(0); }
.griff { width: 40px; height: 5px; border-radius: 3px; background: var(--linie); margin: 4px auto 10px; }
.wkopf { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.wform { font-family: var(--serif); font-size: 30px; font-weight: 600; }
.stern { border: 1.5px solid var(--linie); background: none; border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.stern.an { border-color: var(--akzent); color: var(--akzent); }
.wfeld { margin: 10px 0; }
.wlabel { font-size: 12px; font-weight: 700; color: var(--leise); text-transform: uppercase; letter-spacing: .03em; }
.wlemma { font-family: var(--serif); font-size: 19px; }
.wrolle { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--linie); }

.uliste { list-style: none; padding: 0; margin: 0; }
.uliste button {
  width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--linie);
  padding: 10px 2px; cursor: pointer; display: flex; gap: 10px; align-items: baseline;
}
.uliste .nr { font-weight: 700; width: 22px; flex: none; }
.uliste .anf { font-family: var(--serif); flex: 1; }
.uliste .st { flex: none; color: var(--o); font-weight: 700; }
.uliste .hier { color: var(--akzent); }
.gesamt { font-size: 15px; white-space: pre-wrap; }

.auto { font-size: 13px; color: var(--leise); border-left: 3px solid var(--a); padding: 2px 0 2px 8px; margin: 0 0 8px; }

/* Texte und Import */
.tliste { list-style: none; padding: 0; margin: 0 0 6px; }
.tliste li { display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--linie); }
.tliste li.hier .ttitel { color: var(--akzent); }
.twahl {
  flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 10px 2px; cursor: pointer;
  display: grid; grid-template-columns: 1fr auto; gap: 0 10px;
}
.ttitel { font-family: var(--serif); font-size: 18px; font-weight: 600; }
.tunter { grid-column: 1; font-size: 13px; color: var(--leise); }
.tstand { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-size: 14px; color: var(--leise); font-variant-numeric: tabular-nums; }
.vweg.warnen { color: var(--p); font-size: 14px; font-weight: 600; }
.anleitung { padding-left: 20px; margin: 6px 0 12px; }
.anleitung a { color: var(--akzent); }
.datei { display: inline-block; cursor: pointer; }
.datei input { display: block; margin-top: 6px; font-size: 13px; max-width: 100%; }

/* Methode & Vokabeln */
h2 { font-family: var(--serif); font-size: 24px; margin: 8px 0 6px; }
h3 { font-size: 17px; margin: 18px 0 6px; }
.leise { color: var(--leise); }
.schrittliste { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.schrittliste li { background: var(--karte); border: 1px solid var(--linie); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
.schrittliste b { display: block; }
.schrittliste .pf { font-size: 14px; color: var(--leise); }
.tabelle { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--karte); border-radius: 12px; overflow: hidden; }
.tabelle th, .tabelle td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--linie); vertical-align: top; }
.tabelle th { font-size: 12px; text-transform: uppercase; color: var(--leise); }
.tabelle td:first-child { font-family: var(--serif); font-style: italic; }
.fallen li { margin-bottom: 4px; }
.hinweis { font-size: 13px; color: var(--leise); margin-top: 24px; }

.vzeile { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--linie); }
.vzeile .vtext { flex: 1; }
.vzeile .vlemma { font-family: var(--serif); font-size: 18px; }
.vzeile .vmeta { font-size: 13px; color: var(--leise); }
.vweg { border: 0; background: none; color: var(--leise); font-size: 18px; padding: 4px 8px; cursor: pointer; }
.sitzt { color: var(--o); font-size: 13px; font-weight: 700; }
.abfrage { text-align: center; }
.afrage { font-family: var(--serif); font-size: 30px; margin: 10px 0 4px; }
.aform { color: var(--leise); font-size: 14px; margin-bottom: 14px; }
.aantwort { margin: 10px 0 14px; }
.aantwort .wlemma { margin-bottom: 4px; }
.abfrage .knoepfe { justify-content: center; }

/* Update-Banner (siehe Skill app-update-iphone) */
.update {
  position: fixed; left: 12px; right: 12px; top: max(env(safe-area-inset-top), 12px); z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: #34c759; color: #06240e;
  padding: 12px 14px; border-radius: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.35);
  opacity: 0; transition: opacity .35s ease; pointer-events: none;
}
.update.an { opacity: 1; pointer-events: auto; }
.update[hidden] { display: none; }
.update.info { background: #2d2d33; color: #f2f2f7; font-weight: 500; }
.update.unten { top: auto; bottom: max(env(safe-area-inset-bottom), 12px); }
.update .btn { width: auto; padding: 8px 14px; font-size: 15px; background: #06240e; color: #fff; }

/* Neue Seite (Werkstatt) */
.ws { display: flex; flex-direction: column; gap: 12px; }
.ws h2 { margin-bottom: 0; }
.ws h3 { font-family: var(--serif); font-size: 20px; margin: 0; display: flex; align-items: baseline; gap: 10px; }
.ws .nr { font-family: var(--sans); font-size: 13px; font-weight: 700; color: var(--akzent); border: 1.5px solid currentColor; border-radius: 999px; width: 24px; height: 24px; display: inline-grid; place-items: center; flex: none; }
.ws p { margin: 0; }
.ws .schritt { background: var(--karte); border: 1px solid var(--linie); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ws .schritt.zu { opacity: .55; }
.ws .schritt.zu .nur-offen { display: none; }
.ws .knoepfe { align-items: center; }
.ws .vorschau { display: flex; flex-wrap: wrap; gap: 8px; }
.ws .vorschau img { height: 96px; width: auto; border-radius: 8px; border: 1px solid var(--linie); }
.ws textarea { min-height: 0; margin: 0; }
.ws textarea.latein { font-family: var(--serif); font-size: 18px; line-height: 1.5; padding: 8px 10px; }
.ws input[type=text] { width: 100%; border: 1.5px solid var(--linie); border-radius: 10px; padding: 8px 10px; font: 16px var(--sans); background: var(--bg); color: var(--text); }
.ws .felder { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.ws .felder label { font-size: 12px; font-weight: 700; color: var(--leise); text-transform: uppercase; letter-spacing: .03em; display: flex; flex-direction: column; gap: 4px; }
.ws .einheiten { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.ws .einheit { border-top: 1px solid var(--linie); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.ws .ekopf { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--leise); }
.ws .ekopf input { width: 72px; padding: 4px 6px; font-size: 14px; }
.ws .ekopf .weg { margin-left: auto; border: 0; background: none; color: var(--leise); cursor: pointer; font-size: 14px; padding: 4px 6px; }
.ws .unsicher { font-size: 14px; color: var(--a); }
.ws .liste { list-style: none; padding: 0; margin: 0; }
.ws .liste li { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--linie); }
.ws .snr { font-weight: 700; font-variant-numeric: tabular-nums; }
.ws .sanf { font-family: var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ws .sstat { font-size: 13px; font-weight: 600; white-space: nowrap; }
.ws .smeld { grid-column: 2 / span 2; font-size: 13px; color: var(--p); }
.ws .s-fertig { color: var(--o); } .ws .s-laeuft { color: var(--a); } .ws .s-fehler { color: var(--p); } .ws .s-offen { color: var(--leise); }
.ws .ergebnis { border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.ws .ergebnis.gut { background: var(--ok); } .ws .ergebnis.schlecht { background: var(--bad); }
.ws .datei { display: inline-block; }
.nurpages { margin-top: 12px; }
.nurpages a { color: var(--akzent); }

.kopf { top: env(safe-area-inset-top, 0px); padding-top: 8px; }
.tabs { padding-bottom: 6px; }
main { padding-bottom: 96px; }

// Findet Strukturfehler (fehlende Felder, Verweise ins Leere, falsche Typen) –
// keine inhaltlichen Fehler in der Analyse.
(function (wurzel) {
  const PHASEN = ['gliedern', 'verb', 'subjekt', 'ergaenzung', 'bezug', 'konstr', 'falle', 'uebersetzen'];
  const TYPEN = ['tippen', 'bezug', 'wahl', 'text'];
  const ROLLE = /^[PSOATKV]\*?$/;
  const WORTFELDER = ['t', 'l', 'b', 'f', 'fn', 'r', 'c'];
  const istText = x => typeof x === 'string' && x.trim() !== '';

  // 'wort' = erstes Vorkommen, 'wort#2' = zweites
  function finde(s, ref) {
    if (typeof ref !== 'string') return -1;
    const [form, nr] = ref.split('#');
    let n = Number(nr || 1);
    for (let i = 0; i < s.w.length; i++) if (s.w[i].t === form && --n === 0) return i;
    return -1;
  }

  const istEinleitewort = wd => typeof wd.r === 'string' && (wd.r.endsWith('*') || /leitet .* ein/.test(wd.fn || ''));

  function pruefeSatz(s, ort = s && s.id || 'Satz') {
    const fehler = [];
    const f = t => fehler.push(`${ort}: ${t}`);
    if (!s || typeof s !== 'object') { f('kein Objekt'); return fehler; }
    for (const feld of ['id', 'ref', 'thema', 'woertlich', 'gut']) if (!istText(s[feld])) f(`${feld} fehlt`);
    if (!Array.isArray(s.merke) || !s.merke.length || !s.merke.every(istText)) f('merke fehlt');
    if (!Array.isArray(s.w) || !s.w.length) { f('Wortliste w fehlt'); return fehler; }
    if (!s.teile || typeof s.teile !== 'object') { f('teile fehlt'); return fehler; }

    s.w.forEach((wd, i) => {
      if (!wd || typeof wd !== 'object') return f(`Token ${i + 1} ist kein Objekt`);
      if ('p' in wd) { if (!istText(wd.p)) f(`Satzzeichen ${i + 1} leer`); return; }
      for (const feld of WORTFELDER) {
        if (feld === 'c' ? !(Number.isInteger(wd.c) || /^\d+$/.test(wd.c)) : !istText(wd[feld])) f(`${wd.t || 'Wort ' + (i + 1)}: Feld ${feld} fehlt`);
      }
      if (istText(wd.r) && !ROLLE.test(wd.r)) f(`${wd.t}: Rolle ${wd.r} unbekannt`);
      if (wd.c !== undefined && !s.teile[wd.c]) f(`${wd.t}: Teilsatz ${wd.c} nicht in teile`);
    });
    const benutzt = new Set(s.w.filter(x => x && !('p' in x)).map(x => String(x.c)));
    for (const [id, t] of Object.entries(s.teile)) {
      if (!benutzt.has(id)) f(`Teilsatz ${id} ohne Wörter`);
      if (!t || !Number.isInteger(t.lvl) || t.lvl < 0 || !istText(t.name)) f(`Teilsatz ${id}: lvl oder name fehlt`);
    }

    if (!Array.isArray(s.schritte) || !s.schritte.length) { f('schritte fehlen'); return fehler; }
    s.schritte.forEach((st, k) => {
      const o = `Schritt ${k + 1}`;
      if (!st || typeof st !== 'object') return f(`${o} ist kein Objekt`);
      if (!PHASEN.includes(st.ph)) f(`${o}: Phase ${st.ph} unbekannt`);
      if (!TYPEN.includes(st.typ)) f(`${o}: Typ ${st.typ} unbekannt`);
      if (!istText(st.frage)) f(`${o}: frage fehlt`);
      for (const liste of ['ziel', 'auch']) {
        if (st[liste] !== undefined && !(Array.isArray(st[liste]) && st[liste].every(istText))) f(`${o}: ${liste} ist keine Liste von Wörtern`);
      }
      if (st.falsch !== undefined && (typeof st.falsch !== 'object' || Array.isArray(st.falsch) || !Object.values(st.falsch).every(istText))) f(`${o}: falsch ungültig`);
      const refs = [...(st.ziel || []), ...(st.auch || []), ...Object.keys(st.falsch || {})];
      if (st.fokus !== undefined) refs.push(st.fokus);
      for (const r of refs) if (finde(s, r) < 0) f(`${o}: Verweis „${r}“ nicht im Satz`);
      if (st.typ === 'tippen' || st.typ === 'bezug') {
        if (!st.ziel || !st.ziel.length) f(`${o}: ziel fehlt`);
        if (!istText(st.erk)) f(`${o}: erk fehlt`);
        for (const r of st.ziel || []) {
          if ((st.auch || []).includes(r)) f(`${o}: ${r} steht in ziel und auch`);
          if (st.falsch && r in st.falsch) f(`${o}: ${r} steht in ziel und falsch`);
        }
      }
      if (st.typ === 'bezug' && !istText(st.fokus)) f(`${o}: fokus fehlt`);
      if (st.ph === 'gliedern' && st.typ === 'tippen') {
        for (const r of st.ziel || []) {
          const i = finde(s, r);
          if (i >= 0 && !istEinleitewort(s.w[i])) f(`${o}: ${r} ist Ziel beim Gliedern, aber nicht als Einleitewort markiert (r mit * oder fn „leitet … ein“)`);
        }
      }
      if (st.typ === 'wahl') {
        if (!Array.isArray(st.opts) || st.opts.length < 2 || !st.opts.every(istText)) f(`${o}: opts fehlen`);
        else {
          if (!(Number.isInteger(st.ok) && st.ok >= 0 && st.ok < st.opts.length)) f(`${o}: ok außerhalb der Optionen`);
          if (st.warum !== undefined) {
            if (!Array.isArray(st.warum) || st.warum.length !== st.opts.length) f(`${o}: warum muss so lang sein wie opts`);
            else if (st.warum[st.ok] !== null) f(`${o}: warum an der richtigen Stelle muss null sein`);
          }
        }
        if (!istText(st.erk)) f(`${o}: erk fehlt`);
      }
    });
    if (s.schritte[s.schritte.length - 1]?.typ !== 'text') f('letzter Schritt ist nicht die Übersetzung (typ text)');
    return fehler;
  }

  function pruefeText(text) {
    const fehler = [];
    if (!text || typeof text !== 'object') return ['Kein Text-Objekt.'];
    if (!istText(text.id)) fehler.push('id fehlt');
    if (!istText(text.titel)) fehler.push('titel fehlt');
    if (!Array.isArray(text.saetze) || !text.saetze.length) return [...fehler, 'saetze fehlen'];
    const ids = new Set();
    text.saetze.forEach((s, i) => {
      fehler.push(...pruefeSatz(s, `Satz ${i + 1}`));
      if (s && ids.has(s.id)) fehler.push(`Satz ${i + 1}: id ${s.id} doppelt`);
      if (s) ids.add(s.id);
    });
    return fehler;
  }

  wurzel.Pruefung = { finde, istEinleitewort, pruefeSatz, pruefeText };

  // ───────── Texterkennung
  function promptErkennen(teile, nFotos, rohtext) {
    const bildInfo = rohtext ? 'Der Text steht unten (eingefügt, nicht als Bild).'
      : teile > 1
        ? `Die ${nFotos * teile} Bilder zeigen ${nFotos === 1 ? 'eine Buchseite' : nFotos + ' Buchseiten'}, jede in ${teile} waagrechte Streifen von oben nach unten geschnitten, die sich leicht überlappen. Doppelt sichtbare Zeilen nur einmal übernehmen.`
        : `Die Bilder zeigen ${nFotos === 1 ? 'eine Buchseite' : nFotos + ' Buchseiten'} in Reihenfolge.`;
    return `Du hilfst beim Erstellen von Lernmaterial für eine Latein-Übersetzungs-App. ${bildInfo}

- Silbentrennungen am Zeilenende zusammenfügen (quis- | que → quisque).
- Kapitel- und Abschnittszahlen wie „1 (1)“ oder „(2)“ nicht in den Text übernehmen, sondern als Stellenangabe "ref" im Format "1,1", "1,2" den Einheiten zuordnen. Hat der Text keine solchen Zahlen, "ref" leer lassen.

{"autor": "Seneca", "werk": "De vita beata", "stelle": "Kapitel 1, Abschnitt 1–2", "einheiten": [{"ref": "1,1", "text": "Vivere, Gallio frater, omnes beate volunt, …"}], "unsicher": [], "hinweis": ""}${rohtext ? '\n\nText:\n' + rohtext : ''}`;

  // Fotos in waagrechte Streifen schneiden: die Plattform verkleinert jedes Bild auf etwa 1,2 Megapixel,
  // Streifen behalten so mehr Auflösung für die Schrift.
  async function streifen(datei, teile) {
    const url = URL.createObjectURL(datei);
    try {
      const bild = await new Promise((ok, nein) => { const i = new Image(); i.onload = () => ok(i); i.onerror = nein; i.src = url; });
      const b = bild.naturalWidth, h = bild.naturalHeight, ueber = Math.round(h * 0.06);
      const skal = Math.min(1, 2400 / Math.max(b, h / teile));
      const ergebnis = [];
      for (let k = 0; k < teile; k++) {
        const y0 = Math.max(0, Math.round(k * h / teile) - ueber), y1 = Math.min(h, Math.round((k + 1) * h / teile) + ueber);
        const c = document.createElement('canvas');
        c.width = Math.round(b * skal); c.height = Math.round((y1 - y0) * skal);
        c.getContext('2d').drawImage(bild, 0, y0, b, y1 - y0, 0, 0, c.width, c.height);
        ergebnis.push(await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.9)));

  async function erkennen() {
    const roh = (api.$('ws-rohtext')?.value || '').trim();
    if (!fotos.length && !roh) return;
    const knopf = api.$('ws-erkennen'); if (knopf) knopf.disabled = true;
    status('ws-s1-status', 'Claude liest den Text …');
    const ctl = new AbortController(); laufend.add(ctl);

        teile = Math.max(1, Math.min(3, Math.floor(max / fotos.length)));

      st = { ...leer(), autor: str(a.autor), werk: str(a.werk), stelle: str(a.stelle),
        unsicher: Array.isArray(a.unsicher) ? a.unsicher.map(String).slice(0, 20) : [],
        einheiten: einheiten.map((e, k) => ({ ref: str(e.ref) || String(k + 1), text: e.text.trim(), status: 'offen', satz: null, fehler: [] })), phase: 2 };
      sichere(); zeige();
      status('ws-s1-status', `${st.einheiten.length} Einheiten erkannt.`);

      status('ws-s1-status', meldung(e));
    } finally { laufend.delete(ctl); if (knopf) knopf.disabled = false; }
  }

  // ───────── Analyse je Einheit
  function promptAnalyse(i, vorige) {

Werk: ${[st.autor, st.werk].filter(Boolean).join(', ') || 'unbekannt'}${st.stelle ? ' (' + st.stelle + ')' : ''}
Die ganze Seite, damit du den Zusammenhang kennst:

Gib genau ein JSON-Objekt zurück, aufgebaut wie dieses fertige Beispiel aus Seneca, De vita beata:

Feldregeln:

Prüfe jede Form im Zusammenhang der ganzen Seite. Antworte nur mit dem JSON-Objekt.`;
    if (vorige) {
      p += `\n\nDeine vorige Antwort auf genau diese Aufgabe hatte formale Fehler:\n- ${vorige.fehler.join('\n- ')}\n\nVorige Antwort:\n${JSON.stringify(vorige.satz)}\n\nGib das vollständige, korrigierte JSON-Objekt zurück.`;
    }
    return p;
  }

  function pruefeEinheit(i, s) {
    const e = st.einheiten[i];
    if (!s || typeof s !== 'object' || Array.isArray(s)) return ['Antwort ist kein JSON-Objekt'];
    s.id = 's' + (i + 1); s.ref = stelle(e, i);   // setzt die Seite selbst, nie Claudes Fehler
    const fehler = Pruefung.pruefeSatz(s, 'Einheit ' + (i + 1));
    if (Array.isArray(s.w)) {
      const woerter = nurBuchstaben(s.w.filter(x => x && typeof x.t === 'string').map(x => x.t).join(''));
      if (woerter !== nurBuchstaben(e.text)) fehler.push(`Einheit ${i + 1}: Die Wörter in "w" weichen vom Text der Einheit ab – jedes Wort genau so übernehmen, wie es im Text steht.`);
    }
    return fehler;
  }

  async function analysiereEinheit(i, frisch) {
    const e = st.einheiten[i];
    e.status = 'laeuft'; e.fehler = []; e.info = 'Claude denkt nach …'; zeigeListe();
    const ctl = new AbortController(); laufend.add(ctl);
    const opts = (rund) => {
      const o = { modelTier: 'complex', signal: ctl.signal,
        onText: ({ text }) => { e.info = `${rund ? 'korrigiert' : 'schreibt'} … ${text.length.toLocaleString('de-DE')} Zeichen`; zeigeListe(); } };
      if (frisch || rund > 0) o.cache = false;   // „Nochmal“ und Nachbesserung sollen wirklich neu fragen
      return o;
    };
    try {
      let satz = await api.sample.json(promptAnalyse(i), opts(0));
      let fehler = pruefeEinheit(i, satz);
      if (fehler.length) {                       // eine gezielte Nachbesserung, nicht mehr
        e.info = 'Formfehler gefunden, Claude bessert nach …'; zeigeListe();
        satz = await api.sample.json(promptAnalyse(i, { fehler: fehler.slice(0, 15), satz }), opts(1));
        fehler = pruefeEinheit(i, satz);
      }
      if (fehler.length) { e.status = 'fehler'; e.fehler = fehler.slice(0, 4); e.satz = null; e.roh = satz; }
      else { e.status = 'fertig'; e.satz = satz; delete e.roh; }
    } catch (err) {
      e.status = err?.code === 'cancelled' ? 'offen' : 'fehler';
      e.fehler = err?.code === 'cancelled' ? [] : [meldung(err)];
      if (endgueltig(err?.code)) throw err;
    } finally {
      laufend.delete(ctl); e.info = ''; sichere(); zeigeListe();
    }
  }

    analyseLaeuft = true; st.phase = Math.max(st.phase, 3); sichere(); zeige();

    let abbruch = null;
    const arbeiter = async () => {             // zwei Sätze gleichzeitig; die Plattform reiht weitere ein
      while (offen.length && !abbruch) {
        const i = offen.shift();
        try { await analysiereEinheit(i, !!nur); } catch (err) { abbruch = err; }
      }
    };
    await Promise.all([arbeiter(), arbeiter()]);
    analyseLaeuft = false;
    if (st.einheiten.length && st.einheiten.every(e => e.status === 'fertig')) st.phase = 4;
    sichere(); zeige();

    if (!feld || !st.einheiten[i]) return;

    if (st.phase > 2) st.phase = 3;

  });

  function init(a) {
    api = a;
    st = Object.assign(leer(), api.laden() || {});
    // Ein unterbrochener Lauf gilt als wartend; aufgehobene Antworten nach einer Korrektur der Prüfung neu prüfen
    st.einheiten.forEach((e, i) => {

  }

  return { init, render, laeuft: () => analyseLaeuft };

// ───────────────────────────── Texte: eingebaute und importierte
const finde = Pruefung.finde;
function bereite(text) {
  if (text._bereit) return;
  text._bereit = true;
  for (const s of text.saetze) {
    for (const wd of s.w) {
      if (wd.p) continue;
      wd.rolle = wd.r[0];
      wd.einl = Pruefung.istEinleitewort(wd);
      wd.zusatz = wd.rolle === 'P' ? (/Prädikatsnomen/.test(wd.fn) ? 'pn' : (text.saetze && s.teile[wd.c]?.lvl === 0 ? 'hs' : ''))
        : wd.rolle === 'O' && /Dat\./.test(wd.f) ? 'od' : '';
    }
    for (const st of s.schritte) {
      st._ziel = (st.ziel || []).map(r => finde(s, r));
      st._auch = (st.auch || []).map(r => finde(s, r));
      st._falsch = new Map(Object.entries(st.falsch || {}).map(([r, t]) => [finde(s, r), t]));
      st._fokus = st.fokus ? finde(s, st.fokus) : -1;
    }
  }
}

// Dokumente: stand (Fortschritt), vokabeln, werkstatt (angefangene Seite), texte/<id> (eigene Seiten als JSON-Text).
// Im Konto liegt alles unter data/users/<id>/ – privat, auf jedem Gerät gleich. Auf dem Gerät unter seneca.*.
const use = n => (window.claude && typeof window.claude.use === 'function' ? window.claude.use(n) : Promise.resolve(null));
const klon = x => (x == null ? x : JSON.parse(JSON.stringify(x)));
let db = null, uid = null, sample = null, grenzen = null, geladen = false;

const Lager = {
  art: 'geraet',
  letzt: {}, kette: {},
  ref(name) { return db.doc(`data/users/${uid}/${name}`); },
  texte() { return db.collection(`data/users/${uid}/bibliothek/texte`); },
  async lies(name) {
    if (this.art === 'konto') {
      const snap = await this.ref(name).get();
      const d = snap.exists ? klon(snap.data()) : null;
      this.letzt[name] = d ? JSON.stringify(d) : null;
      return d;
    }
    try { return JSON.parse(localStorage.getItem('seneca.' + name)); } catch (_) { return null; }
  },
  // Schreibt nur bei Änderung, je Dokument einen Vorgang nach dem anderen
  schreib(name, obj) {
    const json = JSON.stringify(obj);
    if (json === this.letzt[name]) return;
    this.letzt[name] = json;
    if (this.art !== 'konto') { try { localStorage.setItem('seneca.' + name, json); } catch (_) { melde('Der Speicher auf diesem Gerät ist voll.'); } return; }
    const daten = JSON.parse(json);
    this.kette[name] = (this.kette[name] || Promise.resolve())
      .then(() => this.ref(name).set(daten))
      .catch(e => this.ref(name).set(daten).catch(e2 => melde(e2?.code === 'quota_exceeded' ? 'Dein Speicher in claude.ai ist voll – entferne einen älteren Text.' : 'Speichern im Konto fehlgeschlagen.')));
  },
  async ladeTexte() {
    if (this.art === 'konto') {
      const q = await this.texte().get();
      return q.docs.map(d => d.data().json).filter(x => typeof x === 'string');
    }
    try { return JSON.parse(localStorage.getItem('seneca.importe')) || []; } catch (_) { return []; }
  },
  async speichereText(id, json, alle) {
    if (this.art === 'konto') return this.texte().doc(id).set({ id, json });
    try { localStorage.setItem('seneca.importe', JSON.stringify(alle)); }
    catch (_) { throw new Error('voll'); }
  },
  loescheText(id, alle) {
    if (this.art === 'konto') return this.texte().doc(id).delete().catch(() => {});
    try { localStorage.setItem('seneca.importe', JSON.stringify(alle)); } catch (_) {}
  },
};

}
let stand = neuerStand();

function waehleText(id) {
  if (TEXT) stand.pos[TEXT.id] = stand.satz;

  const { vok, ...rest } = stand;
  Lager.schreib('stand', rest);
  Lager.schreib('vokabeln', { vok });
  if (werkstattTimer) { clearTimeout(werkstattTimer); werkstattTimer = null; Lager.schreib('werkstatt', werkstattStand); }
}
let werkstattTimer = null, werkstattStand = null;
function speichereWerkstatt(st) {
  werkstattStand = st;
  clearTimeout(werkstattTimer);
  werkstattTimer = setTimeout(() => { werkstattTimer = null; Lager.schreib('werkstatt', werkstattStand); }, 600);
}

// Flüchtiger Zustand des gerade bearbeiteten Schritts
let sitzung;
function neueSitzung() {
  sitzung = {
    auswahl: new Set(), ergebnis: null, rueck: '', tipp: false, versuche: 0,
    wahlFalsch: new Set(), zeigeW: false, zeigeG: false,
    satzbildOffen: sitzung ? sitzung.satzbildOffen : null, aufgedeckt: sitzung ? sitzung.aufgedeckt : new Set(),
  };
}
neueSitzung();
let abfrage = null;   // Vokabelabfrage

const satz = () => SAETZE[stand.satz];
const fort = () => (stand.fort[satz().id] ||= { akt: 0, g: {} });
const schritt = () => satz().schritte[fort().akt];
const modus = () => stand.modus[satz().id] || 'gefuehrt';

function sichtbareRollen() {
  const s = satz(), f = fort();
  if (f.fertig || stand.alle[s.id]) return new Set(Object.keys(ROLLEN));
  const r = new Set();
  s.schritte.forEach((st, k) => { if (f.g[k]) (PHASE_ROLLEN[st.ph] || []).forEach(x => r.add(x)); });
  return r;
}
function gegliedert() {
  const s = satz(), f = fort();
  return f.fertig || s.schritte.some((st, k) => st.ph === 'gliedern' && f.g[k]);
}

// ───────────────────────────── Hilfen
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = id => document.getElementById(id);
const lemmaKey = wd => wd.l.split(/[ ,(]/)[0].toLowerCase();

function wortKlassen(s, i, rollen, imText) {
  const wd = s.w[i], k = ['wort'];
  if (rollen.has(wd.rolle)) { k.push('r-' + wd.rolle); if (wd.zusatz) k.push(wd.zusatz); }
  if (rollen.has('K') && wd.einl) k.push('e');
  if (imText && modus() === 'gefuehrt') {
    const st = schritt(), geloest = fort().g[fort().akt];
    if (st.typ === 'tippen' || st.typ === 'bezug') {
      if (geloest) {
        if (st._ziel.includes(i)) k.push('ok');
      } else {
        if (sitzung.auswahl.has(i)) k.push('sel');
        if (sitzung.ergebnis?.ok.has(i)) k.push('ok');
        if (sitzung.ergebnis?.bad.has(i)) k.push('bad');
      }
      if (st._fokus === i) k.push('fokus');
    }
  }
  return k.join(' ');
}

function woerterHtml(s, von, bis, rollen, imText) {
  let h = '';
  for (let i = von; i < bis; i++) {
    const wd = s.w[i];
    if (wd.p) continue;
    // Satzzeichen hängen am Wort davor, damit kein Zeilenumbruch dazwischen fällt
    let pz = '', j = i;
    while (j + 1 < bis && s.w[j + 1].p) pz += `<span class="pz">${esc(s.w[++j].p)}</span>`;
    h += (h ? ' ' : '') + `<span class="wg"><span class="${wortKlassen(s, i, rollen, imText)}" data-i="${i}">${esc(wd.t)}</span>${pz}</span>`;
    i = j;
  }
  return h;
}

// ───────────────────────────── Darstellung: Übersetzen
function renderText() {
  const s = satz(), f = fort(), n = SAETZE.length, rollen = sichtbareRollen();
  let h = `<section class="navi">
    <button class="pfeil" data-act="zurueck" ${stand.satz === 0 ? 'disabled' : ''} aria-label="Voriger Satz">‹</button>
    <button class="mitte" data-act="uebersicht"><b>Satz ${stand.satz + 1}</b> von ${n} <small>· § ${esc(s.ref)}${f.fertig ? ' · ✓' : ''}</small></button>
    <button class="pfeil" data-act="vor" ${stand.satz === n - 1 ? 'disabled' : ''} aria-label="Nächster Satz">›</button>
  </section>
  <div class="modus">
    <button data-act="modus" data-m="gefuehrt" class="${modus() === 'gefuehrt' ? 'an' : ''}">Geführt</button>
    <button data-act="modus" data-m="selbst" class="${modus() === 'selbst' ? 'an' : ''}">Selbstständig</button>
  </div>
  <p class="thema"><b>Worum geht’s:</b> ${esc(s.thema)}</p>`;
  if (!stand.intro) h += renderIntro();
  if (TEXT.auto) h += '<p class="auto">Automatisch erstellt – niemand hat diese Analysen von Hand geprüft. Kommt dir etwas falsch vor, prüf es im Wörterbuch.</p>';

  if (stand.satz > 0) {
    const v = SAETZE[stand.satz - 1].w;
    const rest = v.slice(-7).map(x => x.p ? x.p : ' ' + x.t).join('').trim();
    h += `<div class="kontext">… ${esc(rest)}</div>`;
  }
  h += `<div class="latein" id="latein">${woerterHtml(s, 0, s.w.length, rollen, true)}</div>`;

  if (rollen.size) {
    const vorhanden = new Set(s.w.filter(wd => !wd.p && rollen.has(wd.rolle)).map(wd => wd.rolle + (wd.einl && wd.rolle === 'K' ? ' e' : wd.zusatz ? ' ' + wd.zusatz : '')));
    h += '<div class="legende">' + LEGENDE.filter(([kl]) => vorhanden.has(kl) || (kl.length === 1 && [...vorhanden].some(v => v.startsWith(kl + ' '))))
      .map(([kl, name]) => `<span class="wort r-${kl}">${name}</span>`).join('') + '</div>';
  }

  // Aufgabe direkt unter den Text: Antippen und Prüfen ohne Scrollen; das Satzbild ist Nachschlagewerk
  h += modus() === 'selbst' ? renderCheckliste() : renderKarte();
  h += renderSatzbild(s, rollen);
  $('haupt').innerHTML = h;
}

function renderIntro() {
  return `<div class="intro"><h3>So arbeitest du hier</h3><ol>
    <li>Jeder Satz wird in festen Schritten zerlegt, wie es die Lateindidaktik lehrt: erst Teilsätze, dann Prädikate, dann Subjekte, dann der Rest. Übersetzt wird zuletzt.</li>
    <li>Die Karte unter dem Text stellt die Aufgabe. Tippe die gesuchten Wörter im Text an, dann auf „Prüfen“. Falsch getippte Wörter erklärt dir die App.</li>
    <li>Ein Wort <b>lange drücken</b> schlägt es nach: erst Wörterbuch und Bedeutung, Form und Funktion deckst du auf, wenn du sie selbst bestimmt hast.</li>
    <li>Jeder gelöste Schritt färbt den Satz wie im Schulbuch: <span class="probe"><span class="wort r-P">Prädikat</span> <span class="wort r-S">Subjekt</span> <span class="wort r-O">Objekt</span></span> …</li>
  </ol><button class="btn" data-act="intro-weg">Los geht’s</button></div>`;
}

function renderSatzbild(s, rollen) {
  const frei = gegliedert() || sitzung.satzbildOffen;
  if (!frei) {
    return `<details class="satzbild"><summary>Satzbild</summary>
      <div class="gesperrt">Das Satzbild zeigt Haupt- und Gliedsätze eingerückt. Es erscheint, sobald du den Satz gegliedert hast.
      <div class="knoepfe" style="margin-top:8px"><button class="btn2" data-act="satzbild-frei">Trotzdem zeigen</button></div></div></details>`;
  }
  const zeilen = [], gesehen = new Set();
  let akt = null;
  s.w.forEach((wd, i) => {
    if (wd.p) return;
    if (!akt || akt.c !== wd.c) { akt = { c: wd.c, von: i, bis: i + 1, neu: !gesehen.has(wd.c) }; gesehen.add(wd.c); zeilen.push(akt); }
    akt.bis = i + 1;
    while (akt.bis < s.w.length && s.w[akt.bis].p) akt.bis++;
  });
  const offen = sitzung.satzbildOffen !== false;
  return `<details class="satzbild" ${offen ? 'open' : ''}><summary>Satzbild</summary><div class="zeilen">` +
    zeilen.map(z => {
      const t = s.teile[z.c];
      return `<div class="zeile" data-lvl="${t.lvl}" style="--lvl:${t.lvl}">
        <div class="ztag">${z.neu ? esc(t.name) : '↳ Fortsetzung ' + esc(t.name)}</div>
        <div class="zwoerter">${woerterHtml(s, z.von, z.bis, rollen, false)}</div>
        ${z.neu && t.info ? `<div class="zinfo">${esc(t.info)}</div>` : ''}</div>`;
    }).join('') + '</div></details>';
}

function renderKarte() {
  const s = satz(), f = fort(), k = f.akt, st = s.schritte[k], status = f.g[k], n = s.schritte.length;
  let h = `<div class="karte" id="karte"><div class="kkopf"><span class="phase ph-${st.ph}">${PHASEN[st.ph]}</span><span class="zaehler">Schritt ${k + 1} von ${n}</span></div>
    <p class="frage">${esc(st.frage)}</p>`;

  if ((st.typ === 'tippen' || st.typ === 'bezug') && !status) {
    h += '<div class="antippen">Antippen wählt aus · lange drücken schlägt nach</div>';
  }
  if (st.typ === 'wahl') {
    h += '<div class="optionen">' + st.opts.map((o, i) => {
      const falsch = sitzung.wahlFalsch.has(i), richtig = status && i === st.ok;
      const warum = falsch && st.warum?.[i] ? `<span class="warum">${esc(st.warum[i])}</span>` : '';
      return `<button class="option ${falsch ? 'falsch' : ''} ${richtig ? 'richtig' : ''}" data-act="wahl" data-o="${i}" ${status ? 'disabled' : ''}>${falsch ? '✗ ' : richtig ? '✓ ' : ''}${esc(o)}${warum}</button>`;
    }).join('') + '</div>';
  }
  if (st.typ === 'text') return h + renderUebersetzung() + punkteHtml() + '</div>';

  if (sitzung.tipp && st.tipp && !status) h += `<div class="tipp">Tipp: ${esc(st.tipp)}</div>`;
  if (sitzung.rueck && !status) h += `<div class="rueck">${sitzung.rueck}</div>`;
  if (status) {
    const titel = status === 'ok' ? 'Richtig – auf Anhieb.' : status === 'fehler' ? 'Richtig.' : 'Die Lösung:';
    h += `<div class="lehrer"><div class="ltitel">${titel}</div>${esc(st.erk)}</div>`;
  }

  h += '<div class="knoepfe">';
  if (!status) {
    if (st.tipp) h += `<button class="btn2" data-act="tipp" ${sitzung.tipp ? 'disabled' : ''}>Tipp</button>`;
    if (st.typ !== 'wahl') h += '<button class="btn" data-act="pruefen">Prüfen</button>';
    h += '<button class="btn2" data-act="loesung">Lösung zeigen</button>';
  } else {
    h += '<button class="btn rechts" data-act="weiter">Weiter →</button>';
  }
  return h + '</div>' + punkteHtml() + '</div>';
}

function punkteHtml() {
  const s = satz(), f = fort();
  const erster = s.schritte.findIndex((_, k) => !f.g[k]);
  return '<div class="punkte">' + s.schritte.map((st, k) => {
    const g = f.g[k], erlaubt = g || k === erster || f.fertig;
    return `<button class="punkt ${g || ''} ${k === f.akt ? 'akt' : ''}" data-act="gehe" data-k="${k}" ${erlaubt ? '' : 'disabled'} aria-label="Schritt ${k + 1}">${k + 1}</button>`;
  }).join('') + '</div>';
}

function renderUebersetzung() {
  const s = satz(), f = fort();
  let h = `<textarea id="ueb" placeholder="Deine Übersetzung …" autocomplete="off" autocapitalize="sentences">${esc(stand.ueb[s.id] || '')}</textarea>
    <details class="kontrolle"><summary>Selbstkontrolle vor dem Vergleich</summary><ul>${KONTROLLE.map(t => `<li>${esc(t)}</li>`).join('')}</ul></details>
    <div class="knoepfe">
      <button class="btn2" data-act="zeige-w">${sitzung.zeigeW ? 'Wörtlich ✓' : 'Wörtliche Fassung'}</button>
      <button class="btn2" data-act="zeige-g">${sitzung.zeigeG ? 'Gutes Deutsch ✓' : 'Gutes Deutsch'}</button>
    </div>`;
  if (sitzung.zeigeW || f.fertig) h += `<div class="loesung"><div class="wlabel">Wörtlich</div>${esc(s.woertlich)}</div>`;
  if (sitzung.zeigeG || f.fertig) h += `<div class="loesung"><div class="wlabel">Gutes Deutsch</div>${esc(s.gut)}</div>`;

  if (!f.fertig) {
    h += '<div class="knoepfe" style="margin-top:10px"><button class="btn voll" data-act="fertig">Satz abschließen ✓</button></div>';
  } else {
    h += `<div class="merke"><div class="ltitel">Das nimmst du mit</div><ul>${s.merke.map(m => `<li>${esc(m)}</li>`).join('')}</ul></div>`;
    if (modus() === 'gefuehrt') {
      const aufg = s.schritte.filter(st => st.typ !== 'text').length;
      const anhieb = s.schritte.filter((st, k) => st.typ !== 'text' && f.g[k] === 'ok').length;
      h += `<p class="bilanz">${anhieb} von ${aufg} Schritten auf Anhieb gelöst. Die Farben im Text zeigen jetzt alle Satzglieder.</p>`;
    }
    if (stand.satz < SAETZE.length - 1) h += '<div class="knoepfe"><button class="btn voll" data-act="vor">Nächster Satz →</button></div>';
    else h += '<p class="bilanz">Das war der letzte Satz dieses Abschnitts. Deine Gesamtübersetzung findest du in der Übersicht (Mitte oben).</p>';
  }
  return h;
}

function renderCheckliste() {
  const s = satz(), haken = stand.haken[s.id] || [];
  return `<div class="karte" id="karte"><div class="kkopf"><span class="phase ph-selbst">Selbstständig</span><span class="zaehler">${haken.filter(Boolean).length} / ${CHECKLISTE.length}</span></div>
    <p class="frage">Arbeite die Schritte ab wie bei einem Text ohne App. Wörter antippen = nachschlagen.</p>
    <ol class="haken">${CHECKLISTE.map(([t, d], i) => `<li><label><input type="checkbox" data-act="haken" data-k="${i}" ${haken[i] ? 'checked' : ''}><span><b>${i + 1}. ${t}</b><small>${esc(d)}</small></span></label></li>`).join('')}</ol>
    <div class="knoepfe" style="margin-bottom:12px">
      <button class="btn2" data-act="alle">${stand.alle[s.id] ? 'Farben aus' : 'Satzglieder färben'}</button>
    </div>
    ${renderUebersetzung()}</div>`;
}

// ───────────────────────────── Darstellung: Methode
function renderMethode() {
  const gesammelt = ALLE.flatMap(t => t.saetze.filter(s => stand.fort[s.id]?.fertig)
    .map(s => ({ s, wo: (ALLE.length > 1 ? t.titel + ', ' : '') + 'Satz ' + (t.saetze.indexOf(s) + 1) })));
  $('haupt').innerHTML = `
  <h2>Die Methode</h2>
  <p>Von links nach rechts Wort für Wort zu raten, scheitert an jedem langen Satz. Gute Übersetzer gehen immer in derselben Reihenfolge vor – so lange, bis es automatisch läuft. Genau diese Reihenfolge übt die App mit dir.</p>
  <ol class="schrittliste">
    <li><b>0 · Lesen</b>Den ganzen Satz lesen, am besten laut. Was weißt du schon aus dem Zusammenhang? Satzzeichen beachten.</li>
    <li><b>1 · Gliedern</b>Einleitewörter suchen: Subjunktionen (ut, cum, si, quod, quia, quoniam, ubi, dum, ne …), Relativpronomen (qui, quae, quod …), Fragewörter (quis, quid, quo, qua, quantus …). Jedes eröffnet einen Gliedsatz.<div class="pf">Ergebnis: das Satzbild – Hauptsatz links, Gliedsätze eingerückt.</div></li>
    <li><b>2 · Prädikat</b>Alle finiten Verben (mit Personalendung) suchen und bestimmen: Person, Numerus, Tempus, Modus, Genus verbi.<div class="pf">Prüffrage: Je Teilsatz ein Prädikat? Wenn nicht → Ellipse. Konjunktiv → sofort fragen: warum?</div></li>
    <li><b>3 · Subjekt</b>Ein Nominativ, der im Numerus zum Prädikat passt. Keiner da → es steckt in der Endung (wir, sie …).<div class="pf">Vorsicht: Anrede (Vokativ), Prädikatsnomen, Neutrum Plural auf -a.</div></li>
    <li><b>4 · Ergänzungen</b>Was verlangt das Verb? Akkusativ (wen/was), Dativ (wem), Infinitiv, Richtung. Das Wörterbuch zeigt die Konstruktion.</li>
    <li><b>5 · Bezüge</b>Adjektive, Pronomen und Partizipien suchen ihr Bezugswort: gleicher Kasus, Numerus, Genus (KNG) – nicht unbedingt gleiche Endung.<div class="pf">Getrennt Stehendes (Hyperbaton) zusammenführen. Jedes Pronomen auf sein Bezugswort zurückführen.</div></li>
    <li><b>6 · Konstruktionen</b>Partizipien (PC, Ablativus absolutus), AcI, nd-Formen, indirekte Fragen, Relativsätze, Litotes, Ellipsen – die Signale stehen in der Tabelle unten.</li>
    <li><b>7 · Übersetzen</b>Vom Hauptsatz aus, Gliedsatz für Gliedsatz. Erst wörtlich (alles untergebracht?), dann gutes Deutsch.<div class="pf">Kontrolle: Jedes Wort vertreten? Jede Form richtig? Sinn im Zusammenhang?</div></li>
  </ol>

  <h3>Signale und was sie bedeuten</h3>
  <table class="tabelle"><thead><tr><th>Signal</th><th>Bedeutung → Übersetzung</th></tr></thead><tbody>
    <tr><td>Name zwischen zwei Kommas</td><td>Anrede (Vokativ)</td></tr>
    <tr><td>qu-Wort + Konj. nach Verb des Wissens, Fragens, Sehens</td><td>indirekte Frage → deutsch Indikativ</td></tr>
    <tr><td>adeo / ita / tam / sic / tantus / talis … ut + Konj.</td><td>Konsekutivsatz → „so …, dass“</td></tr>
    <tr><td>ut / ne + Konj. ohne „so“-Wort</td><td>Final- oder Begehrsatz → „damit“, „dass“, „damit nicht“</td></tr>
    <tr><td>ut / ubi + Indikativ</td><td>„wie“ / „sobald, wenn“</td></tr>
    <tr><td>eo … quo + Komparativ</td><td>„um so …, je …“</td></tr>
    <tr><td>nd-Form + esse</td><td>Notwendigkeit → „muss … werden“, „man muss“</td></tr>
    <tr><td>ad + nd-Form (Akk.)</td><td>Zweck → „zum …“, „um zu“</td></tr>
    <tr><td>-urus, -ura, -urum</td><td>Partizip Futur → „im Begriff zu“, „werden“</td></tr>
    <tr><td>-ns, -ntis</td><td>Partizip Präsens → gleichzeitig: „während“, „indem“, „einer, der …“</td></tr>
    <tr><td>Partizip + Nomen im Ablativ, von keinem Verb verlangt</td><td>Ablativus absolutus → „nachdem / während / weil …“</td></tr>
    <tr><td>Akkusativ + Infinitiv nach Verb des Sagens, Denkens, Wahrnehmens</td><td>AcI → „dass“-Satz</td></tr>
    <tr><td>Relativpronomen am Satzanfang</td><td>relativer Satzanschluss → „dieser“</td></tr>
    <tr><td>Konjunktiv im Hauptsatz, ohne Einleitewort</td><td>Aufforderung oder Wunsch → „soll“, „lasst uns“, „möge“</td></tr>
    <tr><td>Wörterbuch: 1. Person auf -or</td><td>Deponens → aktiv übersetzen, auch das Partizip Perfekt</td></tr>
    <tr><td>-e- in der 3./4. Konjugation (1. Sg. -am)</td><td>Futur I → „wird …“</td></tr>
    <tr><td>Superlativ + quisque</td><td>„gerade die …-sten“</td></tr>
    <tr><td>non sine, non nemo, haud …</td><td>Litotes → betont bejahend</td></tr>
    <tr><td>Zeitangabe im Akkusativ ohne Präposition</td><td>Zeitdauer → „… lang“</td></tr>
    <tr><td>esse, fieri, videri</td><td>Kopula → Prädikatsnomen suchen</td></tr>
  </tbody></table>

  <h3>Typische Fallen</h3>
  <ul class="fallen">
    <li><b>-a</b>: Nom. Sg. f. – Abl. Sg. f. – Nom./Akk. Pl. n. (via, ea, diversa). Die Kongruenz entscheidet.</li>
    <li><b>-is</b>: Gen. Sg. der 3. Dekl. – Dat./Abl. Pl. – Nom. Sg. (brevis, naturalis).</li>
    <li><b>-e</b>: Adverb – Abl. Sg. – Neutrum Sg. (beate, facile).</li>
    <li><b>hic, illo, eo, quo</b>: Pronomen oder Adverb? Gibt es ein Bezugswort? Keins → Adverb.</li>
    <li><b>causa</b>: Substantiv („Ursache“) oder nachgestellt „wegen“? Braucht ein Kopulaverb ein Prädikatsnomen?</li>
    <li><b>incola, nauta, agricola, poeta</b>: a-Deklination, aber maskulin.</li>
    <li><b>-etur</b>: in der 2. Konjugation Präsens (videtur), in der 3./4. Futur (conteretur).</li>
    <li><b>Vorsilben</b>: adp → app, inp → imp – im Wörterbuch beide Schreibungen prüfen.</li>
  </ul>

  <h3>So lernst du es</h3>
  <ol>
    <li><b>Geführt:</b> Jeder Satz in Schritten, mit Rückmeldung. Erst selbst versuchen, Tipps sparsam nutzen. Ziel: möglichst viele Schritte auf Anhieb.</li>
    <li><b>Selbstständig:</b> Nur noch die Checkliste. Die App hilft beim Nachschlagen und zeigt am Ende die Lösung.</li>
    <li><b>Ohne App:</b> Buch, Bleistift, Checkliste daneben. Prädikate unterstreichen, Einleitewörter einkreisen, Gliedsätze einklammern.</li>
    <li><b>Vokabeln:</b> Alles, was du nachschlägst, landet unter „Vokabeln“. Genau das ist dein Lernbedarf – täglich fünf Minuten abfragen.</li>
  </ol>

  <h3>Deine Merksätze</h3>
  ${gesammelt.length ? '<ul>' + gesammelt.flatMap(({ s, wo }) => s.merke.map(m => `<li>${esc(m)} <span class="leise">(${esc(wo)})</span></li>`)).join('') + '</ul>'
    : '<p class="leise">Sobald du einen Satz abschließt, sammeln sich hier seine Merksätze.</p>'}

  <p class="hinweis">Analysen und Übersetzungen wurden mit Claude erstellt. Wenn dir eine Analyse falsch vorkommt: Wörterbuch und Grammatik gegenprüfen und Bescheid geben.</p>`;
}

// ───────────────────────────── Darstellung: Vokabeln
function renderVokabeln() {
  const eintraege = Object.entries(stand.vok).sort((a, b) => a[1].zeit - b[1].zeit);
  if (abfrage) return renderAbfrage();
  $('haupt').innerHTML = `<h2>Meine Vokabeln</h2>

// Nimmt eine Seite (Objekt oder JSON-Text) in die Bibliothek auf. Liefert null bei Erfolg, sonst eine Fehlermeldung (HTML).
function uebernimm(quelle) {
  let t = quelle;
  if (typeof quelle === 'string') {
    try { t = JSON.parse(quelle.trim()); } catch (_) { return 'Das ist keine vollständige Seite. Bitte den ganzen Text einfügen.'; }
  }
  const fehler = Pruefung.pruefeText(t);
  if (fehler.length) {
    return 'Nicht übernommen – die Seite hat formale Fehler:<br>' + fehler.slice(0, 6).map(esc).join('<br>') +
      (fehler.length > 6 ? `<br>… und ${fehler.length - 6} weitere.` : '');
  }
  t = klon(t);
  if (!/^[A-Za-z0-9_.~:@+-]+$/.test(t.id) || ALLE.some(x => x.id === t.id)) t.id = 'seite-' + Date.now().toString(36);
  t.saetze.forEach(s => { s.id = `${t.id}/${s.id}`; });   // Fortschritt je Text getrennt halten
  if (t.auto !== false) t.auto = true;
  const json = JSON.stringify(t);
  importRoh.push(json);
  try { Lager.speichereText(t.id, json, importRoh)?.catch?.(() => melde('Speichern im Konto fehlgeschlagen.')); }
  catch (_) { importRoh.pop(); return 'Der Speicher auf diesem Gerät ist voll. Entferne zuerst eine ältere Seite.'; }
  bereite(t); ALLE.push(t);
  waehleText(t.id); neueSitzung();
  stand.tab = 'text'; speichereAlles(); render(); window.scrollTo(0, 0);
  showInfo('Neu in der Bibliothek: ' + TEXT.titel + ' – ' + SAETZE.length + ' Sätze', 4);
  return null;
}

function entferneText(id) {
  const t = ALLE.find(x => x.id === id);
  if (!t || TEXTE.includes(t)) return;
  importRoh = importRoh.filter(roh => { try { return JSON.parse(roh).id !== id; } catch (_) { return false; } });
  Lager.loescheText(id, importRoh);
  ALLE.splice(ALLE.indexOf(t), 1);
  for (const s of t.saetze) for (const feld of ['fort', 'ueb', 'haken', 'alle', 'modus']) delete stand[feld][s.id];
  delete stand.pos[id];
  if (TEXT === t) { TEXT = null; waehleText(TEXTE[0].id); }
  neueSitzung(); speichereAlles();
}

// ───────────────────────────── Aktionen
function grund(st, i) {
  if (st._falsch.has(i)) return st._falsch.get(i);
  const wd = satz().w[i];
  switch (st.ph) {
    case 'verb':
      if (/Inf\./.test(wd.f)) return 'Infinitiv – keine Personalendung, also kein Prädikat.';
      if (/Part\.|PPP|PPA|PFA/.test(wd.f)) return 'Partizip – keine Personalendung, also kein Prädikat.';
      if (/Gerund/.test(wd.f)) return 'nd-Form – keine Personalendung.';
      return `keine finite Verbform (${wd.f}).`;
    case 'gliedern': return 'leitet keinen Gliedsatz ein.';
    case 'subjekt': return /Nom\./.test(wd.f) ? 'Nominativ ja – aber passt es inhaltlich und im Numerus zum Prädikat?' : `kein Nominativ (${wd.f}).`;
    case 'ergaenzung': return 'ist keine Ergänzung dieses Verbs.';
    case 'bezug': return 'passt nicht – prüfe Kasus, Numerus, Genus und den Sinn.';
  }
  return 'passt hier nicht.';
}

function loese(status) {
  fort().g[fort().akt] = status;
  sitzung.ergebnis = null; sitzung.rueck = '';
  speichere(); render();
}

function pruefe() {
  const s = satz(), st = schritt(), sel = sitzung.auswahl;
  if (!sel.size) { sitzung.rueck = 'Tippe zuerst im Text die passenden Wörter an.'; return render(); }
  const ziel = new Set(st._ziel), auch = new Set(st._auch);
  const ok = new Set(), bad = new Set();
  sel.forEach(i => (ziel.has(i) || auch.has(i) ? ok : bad).add(i));
  const fehlt = st._ziel.filter(i => !sel.has(i)).length;
  sitzung.versuche++;
  if (!bad.size && !fehlt) return loese(sitzung.versuche === 1 && !sitzung.tipp ? 'ok' : 'fehler');
  const meld = [...bad].map(i => `<b>${esc(s.w[i].t)}</b>: ${esc(grund(st, i))}`);
  if (fehlt) meld.push(fehlt === 1 ? (bad.size ? 'Außerdem fehlt noch eines.' : 'Gut so weit – eines fehlt noch.') : `${bad.size ? 'Außerdem fehlen' : 'Gut so weit – es fehlen'} noch ${fehlt}.`);
  bad.forEach(i => sel.delete(i));
  sitzung.ergebnis = { ok, bad };
  sitzung.rueck = meld.join('<br>');
  render();
}

function wechsleSatz(k) {
  if (k < 0 || k >= SAETZE.length) return;
  stand.satz = k; stand.pos[TEXT.id] = k; neueSitzung(); sitzung.satzbildOffen = null;
  speichere(); render(); window.scrollTo(0, 0);
}

function zumText() {
  const el = $('latein');
  if (el && el.getBoundingClientRect().top < 60) window.scrollTo({ top: el.offsetTop - 70, behavior: 'smooth' });
}

document.addEventListener('click', e => {
  if (langGedrueckt) { langGedrueckt = false; return; }   // der Klick, der ein langes Drücken abschließt, zählt nicht
  const el = e.target.closest('[data-act], [data-i], [data-tab]');
  if (!el || !geladen) return;

  if (el.dataset.tab) {
    stand.tab = el.dataset.tab; abfrage = null; speichere(); render(); window.scrollTo(0, 0); return;
  }
  const act = el.dataset.act;

  // Wort im Text angetippt
  if (!act && el.dataset.i !== undefined) {
    const i = Number(el.dataset.i), st = schritt(), offen = !fort().g[fort().akt];
    const auswahl = el.closest('#latein') && modus() === 'gefuehrt' && offen && (st.typ === 'tippen' || st.typ === 'bezug');
    if (!auswahl) return zeigeWort(i);
    if (i === st._fokus) return;
    if (st.typ === 'bezug') sitzung.auswahl = sitzung.auswahl.has(i) ? new Set() : new Set([i]);
    else sitzung.auswahl.has(i) ? sitzung.auswahl.delete(i) : sitzung.auswahl.add(i);
    sitzung.ergebnis = null; sitzung.rueck = '';
    return render();
  }

  const s = satz(), f = fort(), st = schritt();
  switch (act) {
    case 'zurueck': return wechsleSatz(stand.satz - 1);
    case 'vor': return wechsleSatz(stand.satz + 1);
    case 'uebersicht': return zeigeUebersicht();
    case 'springe': schliesseBlatt(); return wechsleSatz(Number(el.dataset.k));
    case 'text':
      waehleText(el.dataset.id); neueSitzung(); speichereAlles(); render();
      window.scrollTo(0, 0); return zeigeUebersicht();
    case 'text-weg':
      // Zweistufig: erst nachfragen, dann entfernen (confirm() gibt es in Web-Apps nicht zuverlässig)
      if (el.dataset.sicher !== '1') { el.dataset.sicher = '1'; el.textContent = 'Entfernen?'; el.classList.add('warnen'); return; }
      entferneText(el.dataset.id); render(); return zeigeUebersicht();
    case 'importieren': {
      const fehler = uebernimm($('import-feld').value);
      if (fehler) { const m = $('import-meldung'); m.innerHTML = fehler; m.hidden = false; }
      return;
    }
    case 'schliessen': return schliesseBlatt();
    case 'modus': stand.modus[s.id] = el.dataset.m; neueSitzung(); speichere(); return render();
    case 'intro-weg': stand.intro = true; speichere(); return render();
    case 'tipp': sitzung.tipp = true; return render();
    case 'pruefen': return pruefe();
    case 'loesung':
      if (st.typ === 'wahl') sitzung.wahlFalsch.clear();
      sitzung.auswahl.clear();
      return loese('hilfe');
    case 'wahl': {
      const o = Number(el.dataset.o);
      if (o === st.ok) return loese(sitzung.wahlFalsch.size || sitzung.tipp ? 'fehler' : 'ok');
      sitzung.wahlFalsch.add(o); return render();
    }
    case 'weiter':
      if (f.akt < s.schritte.length - 1) f.akt++;
      neueSitzung(); speichere(); render(); return zumText();
    case 'gehe': f.akt = Number(el.dataset.k); neueSitzung(); speichere(); return render();
    case 'satzbild-frei': sitzung.satzbildOffen = true; return render();
    case 'zeige-w': sitzung.zeigeW = true; speichereAlles(); return render();
    case 'zeige-g': sitzung.zeigeG = true; speichereAlles(); return render();
    case 'fertig':
      f.fertig = true;
      if (modus() === 'gefuehrt') f.g[s.schritte.length - 1] ||= 'ok';
      speichereAlles(); return render();
    case 'alle': stand.alle[s.id] = !stand.alle[s.id]; speichere(); return render();
    case 'aufdecken': sitzung.aufgedeckt.add(s.id + ':' + el.dataset.i); return zeigeWort(Number(el.dataset.i));
    case 'stern': {
      const wd = s.w[Number(el.dataset.i)], key = lemmaKey(wd);
      if (stand.vok[key]) delete stand.vok[key];
      else stand.vok[key] = { l: wd.l, b: wd.b, form: wd.t, werk: TEXT.titel, satz: stand.satz + 1, zeit: Date.now(), gewusst: 0 };
      speichere();
      el.classList.toggle('an', !!stand.vok[key]);
      el.textContent = stand.vok[key] ? '★ in Vokabeln' : '☆ merken';
      return;
    }
    case 'reset-satz':
      delete stand.fort[s.id]; delete stand.haken[s.id]; delete stand.alle[s.id];
      neueSitzung(); speichereAlles(); schliesseBlatt(); return render();
    case 'vok-weg': delete stand.vok[el.dataset.key]; speichere(); return render();
    case 'abfrage': {
      const keys = Object.keys(stand.vok);
      for (let i = keys.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [keys[i], keys[j]] = [keys[j], keys[i]]; }
      keys.sort((a, b) => stand.vok[a].gewusst - stand.vok[b].gewusst);   // stabil: Ungeübtes zuerst
      abfrage = { reihe: keys, zeigen: false, gewusst: 0, nochmal: 0 };
      return render();
    }
    case 'abfrage-zeigen': abfrage.zeigen = true; return render();
    case 'abfrage-gewusst': {
      const key = abfrage.reihe.shift();
      if (stand.vok[key]) stand.vok[key].gewusst++;
      abfrage.gewusst++; abfrage.zeigen = false; speichere(); return render();
    }
    case 'abfrage-nochmal': {
      const key = abfrage.reihe.shift();
      abfrage.reihe.splice(Math.min(3, abfrage.reihe.length), 0, key);
      abfrage.nochmal++; abfrage.zeigen = false; return render();
    }
    case 'abfrage-ende': abfrage = null; return render();
  }
});

// Langes Drücken auf ein Wort = nachschlagen (auch während einer Tipp-Aufgabe)
let langTimer = null, langGedrueckt = false, langStart = null;
document.addEventListener('pointerdown', e => {

for (const ev of ['pointerup', 'pointercancel']) document.addEventListener(ev, () => { clearTimeout(langTimer); langTimer = null; });

function melde(text) { showInfo(text, 5); }

async function starte() {
  render();                                   // Ladezustand
  db = await use('db');
  if (db) { const user = await use('user'); uid = user ? await user.id() : null; }
  if (db && uid) Lager.art = 'konto';
  const [standRoh, vokRoh, texte, werkstattRoh] = await Promise.all([Lager.lies('stand'), Lager.lies('vokabeln'), Lager.ladeTexte(), Lager.lies('werkstatt')]);
  stand = Object.assign(neuerStand(), standRoh || {});
  if (vokRoh?.vok) stand.vok = vokRoh.vok;    // sonst bleibt vok aus einem alten Stand (Version 1.x) erhalten
  for (const roh of texte) {
    try { const t = JSON.parse(roh); if (!Pruefung.pruefeText(t).length) { importRoh.push(roh); ALLE.push(t); bereite(t); } } catch (_) {}
  }
  if (!stand.text && stand.satz) stand.pos[TEXTE[0].id] = stand.satz;   // Stand aus Version 1.0 übernehmen
  waehleText(stand.text);
  geladen = true;

  sample = await use('sample');
  if (sample) {
    grenzen = await sample.limits().catch(() => null);
    Werkstatt.init({ sample, grenzen, esc, $, melde, laden: () => werkstattRoh, speichern: speichereWerkstatt, uebernehmen: uebernimm });
  }
  render();
}
starte();

function ausblenden() {

function bannerAnKante(ausloeser) {
  if (!ausloeser) { updateEl.classList.remove('unten'); return; }
  const r = ausloeser.getBoundingClientRect();
  updateEl.classList.toggle('unten', r.top + r.height / 2 > window.innerHeight / 2);
}
function showInfo(text, sekunden = 2, ausloeser = null) {
  updateEl.className = 'update info';
  bannerAnKante(ausloeser);
  $('update-text').textContent = text;
  $('update-go').hidden = true;
  einblenden();
  clearTimeout(infoTimer);
  if (sekunden) infoTimer = setTimeout(() => { if (updateEl.classList.contains('info')) ausblenden(); }, sekunden * 1000);
}
function zeigeBanner(text) {
  updateEl.className = 'update';
  bannerAnKante(null);
  $('update-text').textContent = text;
  $('update-go').hidden = false;
  einblenden();
}
updateEl.addEventListener('click', () => { if (updateEl.classList.contains('info')) ausblenden(); });
$('update-go').addEventListener('click', () => { speichereAlles(); location.reload(); });

let pruefeGerade = false, gemeldet = null;
const imArtefakt = !!(window.claude && typeof window.claude.use === 'function');
async function checkForUpdate(manual = false) {
  if (imArtefakt) { if (manual) showInfo('Version ' + APP_VERSION + ' – Aktualisierungen kommen in claude.ai von selbst', 4, versionEl); return; }
  if (pruefeGerade) return;
  if (!manual && document.visibilityState !== 'visible') return;
  if (!navigator.onLine) { if (manual) showInfo('Offline – Prüfung nicht möglich', 3, versionEl); return; }
  pruefeGerade = true;
  try {
    const res = await fetch('index.html', { cache: 'no-store' });
    if (!res.ok) return;
    const m = (await res.text()).match(/APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) announceUpdate(m[1], manual);
    else if (manual) showInfo('Version ' + APP_VERSION + ' ist aktuell', 4, versionEl);
  } catch (_) { if (manual) showInfo('Prüfung fehlgeschlagen', 3, versionEl); }
  finally { pruefeGerade = false; }
}
function announceUpdate(v, manual) {
  if (gemeldet === v && !manual) return;
  gemeldet = v;
  speichereAlles();
  zeigeBanner('Neue Version ' + v + ' ist da');
  const tippt = document.activeElement && document.activeElement.id === 'ueb';
  if (manual || !tippt) setTimeout(() => { speichereAlles(); location.reload(); }, manual ? 1500 : 3000);
}
window.addEventListener('pageshow', () => setTimeout(checkForUpdate, 800));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
versionEl.addEventListener('click', () => checkForUpdate(true));

{
  const GESEHEN = 'seneca.gesehen';
  let vorher = null;
  try { vorher = localStorage.getItem(GESEHEN); } catch (_) {}
  if (vorher !== APP_VERSION) {
    try { localStorage.setItem(GESEHEN, APP_VERSION); } catch (_) {}
    if (vorher) setTimeout(() => showInfo('Version ' + APP_VERSION + ' ist geladen', 4), 400);
  }
}

if (!imArtefakt && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
