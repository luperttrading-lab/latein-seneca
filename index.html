<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17161b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Seneca">
<meta name="description" content="Übersetzungshilfe für Seneca, De vita beata – Satz für Satz mit Methode.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>Seneca übersetzen</title>
<script>
const APP_VERSION = '2.0';          // bei JEDER Änderung hochzählen
</script>
</head>
<body>
<header class="kopf">
  <div class="werk"><span class="autor" id="autor">Seneca</span> <span class="schrift" id="schrift">De vita beata</span></div>
  <button class="version" id="version" type="button" aria-label="Nach Update suchen"></button>
</header>

<main id="haupt"></main>

<nav class="tabs" id="tabs">
  <button type="button" data-tab="text">Übersetzen</button>
  <button type="button" data-tab="neu">Neue Seite</button>
  <button type="button" data-tab="methode">Methode</button>
  <button type="button" data-tab="vokabeln">Vokabeln</button>
</nav>

<div class="schleier" id="schleier" hidden></div>
<section class="blatt" id="blatt" hidden aria-modal="true" role="dialog"></section>

<div class="update" id="update" hidden>
  <span id="update-text"></span>
  <button class="btn" id="update-go" type="button">Jetzt laden</button>
</div>

<script src="pruefung.js"></script>
<script src="daten.js"></script>
<script src="werkstatt.js"></script>
<script src="app.js"></script>
</body>
</html>
